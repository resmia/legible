[project]
name = "legible"
version = "0.1.0"
description = "Web interface analysis and remediation tooling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
legible = "legible.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
]
